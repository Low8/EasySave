name: Release EasySave

on:
  push:
    tags:
      - 'v3.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Publish GUI (self-contained, single-file, win-x64)
        run: |
          dotnet publish GUI/GUI.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            /p:PublishSingleFile=true `
            /p:IncludeNativeLibrariesForSelfExtract=true `
            -o publish/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "EasySave ${{ github.ref_name }}"
          files: publish/GUI.exe
          asset_name: EasySave-${{ github.ref_name }}-win-x64.exe
