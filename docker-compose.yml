services:
  easysave-server:
    build:
      context: .
      dockerfile: EasySaveServer/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - EASYSAVE_DATA_DIR=/data
      - EASYSAVE_CONTAINER_HOST_ROOT=/host
    volumes:
      - ./server-data:/data
      - type: bind
        source: C:\
        target: /host/C
